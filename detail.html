<!DOCTYPE html>
<head>
    <script src="products.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product details</title>

    <!--FontAwesome for Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f9f9f9; color: #333; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 20px 40px;
            box-shadow: 0 2px 5px rgba(223,147,157,1);
        }
        .logo { font-size: 24px; font-weight: bold; color: #ff6f61; text-decoration: none; }
        
        nav { display: flex; align-items: center; gap: 30px; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #555; font-weight: 600; transition: color 0.3s; }
        nav a:hover { color: #ff6f61; }

        .social-icons { display: flex; gap: 15px; }
        .social-icons a { color: #df939d; font-size: 20px; transition: color 0.3s; }
        .social-icons a:hover { color: #ff6f61; }
        main { padding: 40px; max-width: 1000px; margin: 0 auto; }
        
        .back-btn {
            background: none;
            border: none;
            color: #ff6f61;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .detail-ansicht {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .detail-ansicht { grid-template-columns: 1fr; }
        }

        .detail-medien img, .detail-medien video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .detail-text h1 { margin-top: 0; color: #333; font-size: 28px; }
        .detail-text .preis { font-size: 22px; color: #ff6f61; font-weight: bold; margin-bottom: 20px; }
        .detail-text p { line-height: 1.6; color: #666; }
        
        .error-message {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">The Crafts Capsule</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About</a></li>
            </ul>
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://tiktok.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                <a href="" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </nav>
    </header>

    <main>
    
        <!-- Hier wird das Produkt dynamisch reingeladen -->
        <div id="product-detail-container">
            <!-- Wird per JS befüllt -->
        </div>
    </main>
</body>
</html>
